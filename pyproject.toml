[project]
name = "pagehub-evals"
version = "0.1.0"
description = "Ground-truth gate for LLM coding harnesses, with inspiration from Postman."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: line length is enforced via `line-length`, not as a lint error.
# UP042: codebase intentionally uses `class X(str, Enum)`; switching to
#        `enum.StrEnum` changes `str(member)` output and risks serialization drift.
ignore = ["E501", "UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are call expressions in argument
# defaults by design; B008 is a false positive for them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests"]
