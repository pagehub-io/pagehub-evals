[project]
name = "pagehub-evals"
version = "0.1.0"
description = "Ground-truth gate for LLM coding harnesses, with inspiration from Postman."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests"]
